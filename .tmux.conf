# Set prefix to Ctrl-a (optional, easier than default Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use | and - for horizontal/vertical split, rather than % and "
unbind %
unbind '"'
bind | split-window -h
bind - split-window -v

# Resizing panes (-r allows repeat)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# More time to repeat commands
set -g repeat-time 1000

# Enable mouse support (click to select pane/resize)
set -g mouse on

# Window naming: just the directory basename, not the whole path
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# -----Status line-----
set -g status-position bottom
set -g status-justify centre

set -g status-style "bg=#40304a"

## Left: session name
set -g status-left "#[fg=#7cc3ff,bold] #S #[fg=#4d5566]│ "
set -g status-left-length 50

## Inactive windows: index brighter than the name
set -g window-status-separator "   |   "
set -g window-status-format "#[fg=#aab4c6]#I #[fg=#79839a]#W"
set -g window-status-current-format "#[fg=#7cc3ff,bold]#I #[fg=#ffffff,bold]#W#[fg=#7cc3ff]#{?window_zoomed_flag, +,}"

## Quiet pane borders to match
set -g pane-border-style "fg=#3a4152"
set -g pane-active-border-style "fg=#b582e8"

## Messages (eg the reload confirmation) in the same palette
set -g message-style "bg=#2b3040,fg=#7cc3ff"
set -g display-time 1500

# -----Plugins-----
set -g @plugin 'tmux-plugins/tpm'
## Claude session manager
set -g @plugin 'craftzdog/tmux-claude-session-manager'
# ------------------

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
